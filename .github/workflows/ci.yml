name: CI

# Runs on every pull request into main and on pushes to main and development.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The build does not connect to anything. These only let the app load its settings.
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB: ci
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
